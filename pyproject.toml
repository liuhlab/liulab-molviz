# ============================== project ==============================

[project]
name = "liulab-molviz"
description = "Draws DNA sequences and plasmids in the browser, from data a caller hands over; later molecules and protein structures in 3D."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
authors = [{ name = "Liu Lab" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# hatch-vcs reads the newest git tag. Never add a `version` key.
dynamic = ["version"]
dependencies = ["typer>=0.12", "mini-racer>=0.14", "vl-convert-python>=1.9,<2.0.0a0"]

[project.scripts]
molviz = "molviz.cli:app"

# ============================== build ==============================

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# No `fallback-version`: that is a hand-written version string.
[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/molviz"]

# The built viewer is gitignored, so hatchling skips it unless named. Named for every target:
# `python -m build` makes the wheel from the sdist, so a file the sdist lacks the wheel lacks.
[tool.hatch.build]
artifacts = ["src/molviz/viewer.js"]

# Fails the build when the viewer was never built, rather than shipping a wheel without it.
[tool.hatch.build.targets.sdist.force-include]
"src/molviz/viewer.js" = "src/molviz/viewer.js"

# ============================== pixi ==============================

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "linux-64"]

[tool.pixi.pypi-dependencies]
liulab-molviz = { path = ".", editable = true }

# The interpreter. `requires-python` is the floor, and conformance holds every other Python
# version this repo declares to it.
# Runtime dependencies are mirrored from `[project] dependencies` so pixi takes them from
# conda-forge rather than PyPI.
[tool.pixi.dependencies]
python = "3.13.*"
typer = ">=0.12"
mini-racer = ">=0.14"
# Below 2: a new major may change the bytes a drawing writes.
vl-convert-python = ">=1.9,<2.0.0a0"
ruff = "*"
# Exact: Pylance is pyright, so the editor and CI must give one verdict.
pyright = "==1.1.411"
python-build = "*"
# Exact: the jargon map and the grade-11 number were measured against this version.
vale = "3.19.0.*"
markdownlint-cli2 = "*"
# For conformance, which parses mkdocs.yml and runs in `default`.
pyyaml = "*"
# The viewer's tools. Its npm packages are in `package.json`, locked by `pnpm-lock.yaml`.
nodejs = "*"
# Older conda-forge pnpm builds for osx-arm64 are x86-64 binaries, which install the wrong
# native packages.
pnpm = ">=12.4"
biome = "*"

[tool.pixi.feature.test.dependencies]
pytest = "*"
# Declared here too, not inherited: the tests run conformance, and a test environment shaped
# differently from this one would import-error on every test.
pyyaml = "*"

# Exact: at 0.0.x nothing promises the next patch is compatible.
[tool.pixi.feature.docs.dependencies]
zensical = "==0.0.57"
mkdocstrings-python = ">=2.0.7,<3"

# On the feature, so these resolve in the `docs` environment with no `-e` flag.
# `serve` ignores `--strict` and says so, hence its absence.
[tool.pixi.feature.docs.tasks]
docs = { cmd = "zensical serve", depends-on = ["docs-viewer"] }
docs-build = { cmd = "zensical build --clean --strict", depends-on = ["docs-viewer"] }
# The site's pages draw with the built viewer, and zensical serves only what is in `docs/`.
docs-viewer = { cmd = "cp src/molviz/viewer.js docs/assets/molviz/viewer.js", depends-on = [
    "build-js",
] }

# The source faces for the viewer's font subsets, which are committed: only a rebuild needs these.
[tool.pixi.feature.fonts.dependencies]
python = "3.13.*"
fonttools = "*"
font-ttf-dejavu = "2.37.*"

[tool.pixi.feature.fonts.tasks]
build-fonts = "python scripts/build_fonts.py"

# `default` takes `test` so pyright can resolve pytest, and not `docs`, which exists so that
# exactly one CI job installs it.
[tool.pixi.environments]
default = { features = ["test"], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
docs = { features = ["docs"], solve-group = "default" }
fonts = { features = ["fonts"], no-default-feature = true }

[tool.pixi.tasks]
lint = "ruff check ."
fmt = "ruff format ."
fmt-check = "ruff format --check ."
typecheck = "pyright"
# The tests read the built viewer, as a caller of the package does.
test = { cmd = "pytest", depends-on = ["build-js"] }
build = { cmd = "python -m build", depends-on = ["build-js"] }
# `.`, never an absolute path: an absolute path matches no `.vale.ini` section and exits 0.
# The globs stop vale walking trees it never lints — check.sh runs steps concurrently, and a
# walk of .pixi/ races pytest writing __pycache__ there.
vale = "vale --glob='!{.pixi,site,dist,build,node_modules}/**' ."
markdownlint = "markdownlint-cli2"
conformance = "python scripts/conformance.py"
# The viewer. `package.json` lists npm packages and nothing else, so its commands live here.
# `inputs` and `outputs` let pixi skip an install that has nothing to do, which also keeps the
# concurrent steps of `check.sh` from running pnpm at once.
install-js = { cmd = "pnpm install --frozen-lockfile", inputs = [
    "package.json",
    "pnpm-lock.yaml",
], outputs = [
    "node_modules/.modules.yaml",
] }
lint-js = "biome ci ."
fmt-js = "biome check --write ."
typecheck-js = { cmd = "pnpm exec tsc", depends-on = ["install-js"] }
test-js = { cmd = "pnpm exec vitest run", depends-on = ["install-js"] }
build-js = { cmd = "pnpm exec vite build", depends-on = ["install-js"] }
# Same bytes on both platforms: CI's `same-bytes` job runs the first on each and the second on
# the two files, which prints their differences and fails if there are any.
digest-drawings = { cmd = "python scripts/digest_drawings.py tests/records", depends-on = [
    "build-js",
] }
same-digests = "diff -u"
# The static step list lives here and nowhere else; `check.sh` takes it as arguments.
check-static = { cmd = "bash scripts/check.sh lint fmt-check typecheck vale markdownlint conformance lint-js typecheck-js", depends-on = [
    "install-js",
] }
check = { depends-on = ["check-static", "test", "test-js"] }

# ============================== ruff ==============================

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
# No `target-version`: ruff infers it from `requires-python`.
extend-exclude = [".pixi", "site", "build", "dist"]

# ruff formats Python code blocks inside Markdown, and `docs/research/` quotes sources verbatim —
# the reason `Lab.Jargon`, `Lab.Readability` and the agent-docs table already exempt it. On the
# formatter alone, so `ruff check`'s reach is unchanged. Narrow, not `*.md`: a fence in README.md
# is an example a reader copies.
[tool.ruff.format]
exclude = ["docs/research/**"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "PT",  # flake8-pytest-style
    "PTH", # flake8-use-pathlib
    "N",   # pep8-naming
    "D",   # pydocstyle (numpy convention, configured below)
    "RUF", # ruff-specific
]
# E501: the formatter owns line length. D203/D213: incompatible with D211/D212.
ignore = ["E501", "D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

# ============================== pyright ==============================

[tool.pyright]
# `scripts` and `skills` included: CI and conformance execute those files.
include = ["src", "tests", "scripts", "skills"]
exclude = ["**/__pycache__", "**/.pixi"]
venvPath = ".pixi/envs"
venv = "default"
# No `pythonVersion`: taken from the interpreter in the environment above.
typeCheckingMode = "standard"
# Not redundant: `standard` does not check that a parameter is annotated at all. `Any`
# satisfies it, so the fix is always in the file you are editing. Scoped off `tests/` below.
reportMissingParameterType = "error"
# Deliberately NOT `reportUnknownParameterType`: it also fails annotated parameters and
# inferred return types whose types an untyped dependency owns. Not a bar a lab repo can meet.
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"

# `tests/` back to plain `standard`. A fixture's type is pytest's, not the author's, and a
# test signature promises a caller nothing: the rule fired four times on twenty lines of
# correct test code and caught nothing (#65). `src` keeps it. Do not delete this block.
[[tool.pyright.executionEnvironments]]
root = "tests"
reportMissingParameterType = "none"

# ============================== pytest ==============================

[tool.pytest.ini_options]
# `src` is collected for its docstring examples alone: `--doctest-modules` runs them, so an
# example that has drifted from the code it documents fails.
testpaths = ["tests", "src"]
# `--continue-on-collection-errors` because collecting `src` IMPORTS every module in it. A
# module needing an absent optional dependency — a plotting path, a CUDA path, a
# platform-specific binding — used to abort collection and run zero tests. It now costs one
# error. Measured: the run still exits non-zero, and a drifted example still fails (#66).
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--doctest-modules",
    "--continue-on-collection-errors",
]
xfail_strict = true
filterwarnings = ["error"]

# ============================== liulab ==============================
# Read by `scripts/conformance.py`; its docstring has the rules.

# The declared agent-facing set. Keys are path prefixes matched against `git ls-files`, not
# globs; a trailing `/` matches a directory. Values name the Vale Length rule, or `false`.
[tool.liulab.agent-docs]
"AGENTS.md" = "LengthDoc"
"GLOSSARY.md" = false         # capped per entry by conformance, not per file
"docs/agents/" = "LengthDoc"
"skills/" = "LengthDoc"
"docs/adr/" = "LengthAdr"
"docs/research/" = false

# Keyed by rule name, value the reason. Per-rule, never per-file; no expiry; printed on every
# run. `placeholder-rename` refuses to be waived.
#
#     [tool.liulab.waived]
#     repo-shape = "docs-only repo; the notebooks under src/ are examples, not a package"
[tool.liulab.waived]
